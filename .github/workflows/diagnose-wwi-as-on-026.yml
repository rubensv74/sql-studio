name: Diagnose WWI AS ON Targets

on:
  push:
    branches:
      - "agent/dogfood-wwi-release-026"
    paths:
      - ".github/workflows/diagnose-wwi-as-on-026.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Microsoft SQL Server samples
        uses: actions/checkout@v7
        with:
          repository: microsoft/sql-server-samples
          ref: 1ab31bc560415b570d57bb5ff9896f4698891321
          path: samples-repo

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install released SQL Studio 0.26.0
        run: |
          python -m pip install --disable-pip-version-check --no-deps \
            https://github.com/rubensv74/sql-studio/releases/download/v0.26.0/sql_studio-0.26.0-py3-none-any.whl

      - name: Trace only AS and ON false targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from sqlstudio import SQLParser, SqlSource
          from sqlstudio.dependencies import DependencyResolver
          from sqlstudio.parser.tokenizer import SQLTokenizer

          root = Path('samples-repo/samples/databases/wide-world-importers/wwi-ssdt')
          parser = SQLParser()
          documents = []
          object_to_source = {}

          for path in sorted(root.rglob('*.sql')):
              source_id = path.as_posix()
              sql = path.read_text(encoding='utf-8', errors='ignore')
              doc = parser.parse_source(SqlSource(source_id, sql, path=source_id))
              documents.append(doc)
              for obj in doc.objects:
                  name = f'{obj.schema}.{obj.name}' if obj.schema else obj.name
                  object_to_source[name.casefold()] = (path, doc)

          graph = DependencyResolver().resolve(documents)
          for suspicious in ('as', 'on'):
              matches = [edge for edge in graph.edges if edge.target.name.casefold() == suspicious]
              print(f'{suspicious.upper()}_EDGE_COUNT', len(matches))
              for edge in matches:
                  path, doc = object_to_source[edge.source.name.casefold()]
                  print(f'EDGE target={suspicious.upper()} source={edge.source.name} kind={edge.kind.value} file={path}')
                  for obj in doc.objects:
                      name = f'{obj.schema}.{obj.name}' if obj.schema else obj.name
                      if name.casefold() == edge.source.name.casefold():
                          for ref in obj.references:
                              if ref.name.casefold() == suspicious:
                                  print('BAD_REF', ref.database, ref.schema, ref.name, ref.kind)
                  sql = path.read_text(encoding='utf-8', errors='ignore')
                  tokens = SQLTokenizer(sql).tokenize()
                  for i, token in enumerate(tokens):
                      if token.kind != 'identifier':
                          continue
                      if token.value.upper() in {'FROM','JOIN','USING','INTO','APPLY','MERGE','UPDATE','REFERENCES'}:
                          lo = max(0, i - 4)
                          hi = min(len(tokens), i + 12)
                          print('TRIGGER', i, token.value.upper(), '::', ' | '.join(t.value for t in tokens[lo:hi]))
                  print('--- SOURCE START ---')
                  print(sql)
                  print('--- SOURCE END ---')
          PY
