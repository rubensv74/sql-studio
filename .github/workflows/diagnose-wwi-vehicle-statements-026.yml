name: Diagnose WWI Vehicle Statements

on:
  push:
    branches:
      - "agent/dogfood-wwi-release-026"
    paths:
      - ".github/workflows/diagnose-wwi-vehicle-statements-026.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Microsoft SQL Server samples
        uses: actions/checkout@v7
        with:
          repository: microsoft/sql-server-samples
          ref: 1ab31bc560415b570d57bb5ff9896f4698891321
          path: samples-repo

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install released SQL Studio 0.26.0
        run: |
          python -m pip install --disable-pip-version-check --no-deps \
            https://github.com/rubensv74/sql-studio/releases/download/v0.26.0/sql_studio-0.26.0-py3-none-any.whl

      - name: Isolate statement emitting ON
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from sqlstudio import SQLParser
          from sqlstudio.parser.tokenizer import SQLTokenizer

          path = Path('samples-repo/samples/databases/wide-world-importers/wwi-ssdt/wwi-ssdt/Website/Functions/VehicleTemperatures.sql')
          sql = path.read_text(encoding='utf-8', errors='ignore')
          tokens = SQLTokenizer(sql).tokenize()

          statements = []
          current = []
          for token in tokens:
              if token.value == ';':
                  if current:
                      statements.append(current)
                  current = []
              else:
                  current.append(token)
          if current:
              statements.append(current)

          print('STATEMENT_COUNT', len(statements))
          for index, statement in enumerate(statements):
              text = ' '.join(token.value for token in statement)
              doc = SQLParser().parse(text + ';')
              bad = []
              for obj in doc.objects:
                  for ref in obj.references:
                      if ref.name.casefold() in {'as','on','with'}:
                          bad.append((ref.name, ref.kind))
              if bad:
                  print('BAD_STATEMENT_INDEX', index)
                  print('BAD_REFS', bad)
                  print('TOKENS', ' | '.join(f'{t.kind}:{t.value}' for t in statement))
                  print('STATEMENT_TEXT', text)

          full = SQLParser().parse(sql)
          print('FULL_OBJECTS')
          for obj in full.objects:
              name = f'{obj.schema}.{obj.name}' if obj.schema else obj.name
              bad = [(r.name, r.kind) for r in obj.references if r.name.casefold() in {'as','on','with'}]
              if bad:
                  print(name, bad)
          PY
