name: Diagnose WWI Cities UPDATE Tokens

on:
  push:
    branches:
      - "agent/dogfood-wwi-release-026"
    paths:
      - ".github/workflows/diagnose-wwi-cities-update-026.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Microsoft SQL Server samples
        uses: actions/checkout@v7
        with:
          repository: microsoft/sql-server-samples
          ref: 1ab31bc560415b570d57bb5ff9896f4698891321
          path: samples-repo

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install released SQL Studio 0.26.0
        run: |
          python -m pip install --disable-pip-version-check --no-deps \
            https://github.com/rubensv74/sql-studio/releases/download/v0.26.0/sql_studio-0.26.0-py3-none-any.whl

      - name: Inspect Cities tokens and bad references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from sqlstudio import SQLParser, SqlSource
          from sqlstudio.parser.tokenizer import SQLTokenizer

          path = Path('samples-repo/samples/databases/wide-world-importers/wwi-ssdt/wwi-ssdt/Application/Tables/Cities.sql')
          sql = path.read_text(encoding='utf-8', errors='ignore')
          doc = SQLParser().parse_source(SqlSource(path.as_posix(), sql))
          for obj in doc.objects:
              name = f'{obj.schema}.{obj.name}' if obj.schema else obj.name
              bad = [ref for ref in obj.references if ref.name.casefold() in {'as','on','with'}]
              if bad:
                  print('OBJECT', name)
                  for ref in bad:
                      print('BAD_REF', ref.name, ref.kind)

          tokens = SQLTokenizer(sql).tokenize()
          for i, token in enumerate(tokens):
              if token.kind == 'identifier' and token.value.upper() == 'UPDATE':
                  pos = token.position
                  lo_text = max(0, pos - 100)
                  hi_text = min(len(sql), pos + 180)
                  print('UPDATE_TOKEN_INDEX', i)
                  print('UPDATE_TOKEN_POSITION', pos)
                  print('UPDATE_RAW_CONTEXT', repr(sql[lo_text:hi_text]))
                  lo = max(0, i - 8)
                  hi = min(len(tokens), i + 18)
                  print('UPDATE_TOKEN_CONTEXT', ' | '.join(f'{t.kind}:{t.value}' for t in tokens[lo:hi]))

          for i, token in enumerate(tokens):
              if token.kind == 'identifier' and token.value.upper() in {'AS','ON','WITH'}:
                  lo = max(0, i - 6)
                  hi = min(len(tokens), i + 10)
                  print('KEYWORD_CONTEXT', token.value.upper(), i, '::', ' | '.join(t.value for t in tokens[lo:hi]))
          PY
