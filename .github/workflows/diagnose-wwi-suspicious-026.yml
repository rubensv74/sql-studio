name: Diagnose WWI Suspicious Targets

on:
  push:
    branches:
      - "agent/dogfood-wwi-release-026"
    paths:
      - ".github/workflows/diagnose-wwi-suspicious-026.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Microsoft SQL Server samples
        uses: actions/checkout@v7
        with:
          repository: microsoft/sql-server-samples
          ref: 1ab31bc560415b570d57bb5ff9896f4698891321
          path: samples-repo

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install released SQL Studio 0.26.0
        run: |
          python -m pip install --disable-pip-version-check --no-deps \
            https://github.com/rubensv74/sql-studio/releases/download/v0.26.0/sql_studio-0.26.0-py3-none-any.whl

      - name: Analyze and trace suspicious targets
        run: |
          sqlstudio repository-analysis \
            samples-repo/samples/databases/wide-world-importers/wwi-ssdt \
            --recursive --output /tmp/wwi.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/wwi.json').read_text(encoding='utf-8'))
          suspicious = {'as', 'on', 'with'}
          object_to_source = {}
          for source in payload['sources']:
              for obj in source['objects']:
                  object_to_source.setdefault(obj.casefold(), source['source_id'])

          for edge in payload['dependencies']['edges']:
              if edge['target'].casefold() not in suspicious:
                  continue
              source_id = object_to_source.get(edge['source'].casefold(), '(source not local)')
              print(f"SUSPICIOUS_EDGE source={edge['source']} target={edge['target']} kind={edge['kind']}")
              print(f"SUSPICIOUS_SOURCE_ID={source_id}")
              if source_id != '(source not local)':
                  path = Path(source_id)
                  print('--- SOURCE TEXT START ---')
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for number, line in enumerate(text.splitlines(), start=1):
                      if any(token in line.upper().split() for token in ('AS','ON','WITH')):
                          start = max(1, number - 3)
                          end = min(len(text.splitlines()), number + 3)
                          lines = text.splitlines()
                          for n in range(start, end + 1):
                              print(f'{n:04d}: {lines[n-1]}')
                          print('---')
                  print('--- SOURCE TEXT END ---')
          PY
