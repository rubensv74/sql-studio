name: PULSE Branch Dogfood

on:
  push:
    branches:
      - "agent/pulse-dogfood-hardening-026"

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SQL Studio branch
        uses: actions/checkout@v7
        with:
          path: sql-studio

      - name: Checkout fixed PULSE corpus
        uses: actions/checkout@v7
        with:
          repository: rubensv74/app_pulse
          ref: 919ea5ed59c856469f873d9a766479fac3fa8391
          path: pulse

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install hardening branch
        run: |
          python -m pip install --disable-pip-version-check --no-deps ./sql-studio
          sqlstudio --version

      - name: Analyze PULSE with branch code
        run: |
          sqlstudio repository-analysis pulse/sql --recursive \
            --output /tmp/pulse-branch-analysis.json \
            --html /tmp/pulse-branch-analysis.html

      - name: Assert dogfood corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/pulse-branch-analysis.json').read_text(encoding='utf-8'))
          summary = payload['summary']
          print('SOURCE_COUNT', summary['source_count'])
          print('PARSED_OBJECT_COUNT', summary['parsed_object_count'])
          print('SCRIPT_OBJECT_COUNT', summary['script_object_count'])
          print('GRAPH_NODE_COUNT', summary['graph_node_count'])
          print('DEPENDENCY_EDGE_COUNT', summary['dependency_edge_count'])
          print('FINDING_COUNT', summary['finding_count'])

          assert summary['source_count'] == 5
          assert summary['parsed_object_count'] == 12
          assert summary['script_object_count'] == 3

          source = next(
              source for source in payload['sources']
              if source['source_id'].endswith('sql/import/001_import_foundations.sql')
          )
          physical_scripts = [
              name for name in source['objects']
              if name.startswith('script:')
          ]
          assert len(physical_scripts) == 1, source

          unknown = {
              node['name'] for node in payload['dependencies']['nodes']
              if node['object_type'] == 'Unknown'
          }
          print('UNKNOWN_NODE_COUNT', len(unknown))
          assert 'eb' not in {name.casefold() for name in unknown}
          assert summary['graph_node_count'] == 34
          assert summary['dependency_edge_count'] == 32

          print('FINDINGS')
          for finding in payload['findings']:
              print(finding['severity'], finding['rule_id'], finding['objects'])
          PY
          test -s /tmp/pulse-branch-analysis.html

      - name: Upload corrected dogfood report
        uses: actions/upload-artifact@v4
        with:
          name: pulse-repository-analysis-hardening-0.26.0
          path: |
            /tmp/pulse-branch-analysis.json
            /tmp/pulse-branch-analysis.html
          if-no-files-found: error
