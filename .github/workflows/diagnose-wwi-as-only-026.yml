name: Diagnose WWI AS Target

on:
  push:
    branches:
      - "agent/dogfood-wwi-release-026"
    paths:
      - ".github/workflows/diagnose-wwi-as-only-026.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Microsoft SQL Server samples
        uses: actions/checkout@v7
        with:
          repository: microsoft/sql-server-samples
          ref: 1ab31bc560415b570d57bb5ff9896f4698891321
          path: samples-repo

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install released SQL Studio 0.26.0
        run: |
          python -m pip install --disable-pip-version-check --no-deps \
            https://github.com/rubensv74/sql-studio/releases/download/v0.26.0/sql_studio-0.26.0-py3-none-any.whl

      - name: Trace AS edge and statement tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from sqlstudio import SQLParser, SqlSource
          from sqlstudio.dependencies import DependencyResolver
          from sqlstudio.parser.tokenizer import SQLTokenizer

          root = Path('samples-repo/samples/databases/wide-world-importers/wwi-ssdt')
          parser = SQLParser()
          documents = []
          object_to_path = {}

          for path in sorted(root.rglob('*.sql')):
              source_id = path.as_posix()
              sql = path.read_text(encoding='utf-8', errors='ignore')
              doc = parser.parse_source(SqlSource(source_id, sql))
              documents.append(doc)
              for obj in doc.objects:
                  name = f'{obj.schema}.{obj.name}' if obj.schema else obj.name
                  object_to_path[name.casefold()] = path

          graph = DependencyResolver().resolve(documents)
          matches = [edge for edge in graph.edges if edge.target.name.casefold() == 'as']
          print('AS_EDGE_COUNT', len(matches))
          for edge in matches:
              path = object_to_path.get(edge.source.name.casefold())
              print('AS_EDGE', edge.source.name, edge.kind.value, path)
              if not path:
                  continue
              sql = path.read_text(encoding='utf-8', errors='ignore')
              doc = SQLParser().parse_source(SqlSource(path.as_posix(), sql))
              for obj in doc.objects:
                  name = f'{obj.schema}.{obj.name}' if obj.schema else obj.name
                  if name.casefold() != edge.source.name.casefold():
                      continue
                  print('BAD_REFS', [(r.name, r.kind) for r in obj.references if r.name.casefold() == 'as'])

              tokens = SQLTokenizer(sql).tokenize()
              statements = []
              current = []
              for token in tokens:
                  if token.value == ';':
                      if current:
                          statements.append(current)
                      current = []
                  else:
                      current.append(token)
              if current:
                  statements.append(current)

              for index, statement in enumerate(statements):
                  text = ' '.join(token.value for token in statement)
                  parsed = SQLParser().parse(text + ';')
                  bad = [
                      (r.name, r.kind)
                      for obj in parsed.objects
                      for r in obj.references
                      if r.name.casefold() == 'as'
                  ]
                  if bad:
                      print('AS_BAD_STATEMENT_INDEX', index)
                      print('AS_BAD_STATEMENT_REFS', bad)
                      print('AS_BAD_STATEMENT_TOKENS', ' | '.join(f'{t.kind}:{t.value}' for t in statement))
                      print('AS_BAD_STATEMENT_TEXT', text)
          PY
