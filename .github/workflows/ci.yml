name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q src cli

      - name: Validate package imports
        run: |
          python -c "import sqlstudio"
          python -c "from sqlstudio.impact_analysis import ImpactAnalysisEngine, ImpactReportExporter"
          python -c "from sqlstudio.circular_dependencies import CircularDependencyEngine, CircularDependencySerializer"
          python -c "from sqlstudio.dead_objects import DeadObjectAnalyzer, DeadObjectSerializer"
          python -c "from sqlstudio.rules import StaticAnalysisAnalyzer, StaticAnalysisRuleEngine, StaticAnalysisSerializer"
          python -c "from sqlstudio import DeadObjectEngine, Severity, StaticAnalysisRuleEngine"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          output=$(python -m unittest discover -s tests -p "test_*.py" -v 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 40)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Unit test failure::$message"
            exit "$status"
          fi

      - name: Validate CLI
        shell: bash
        run: |
          python cli/sqlstudio.py --help
          python cli/sqlstudio.py parse examples/sample_procedure.sql > /tmp/parse.json
          python cli/sqlstudio.py dependencies examples/sample_procedure.sql > /tmp/dependencies.json
          python cli/sqlstudio.py cross-references examples/sample_procedure.sql > /tmp/cross-references.json
          python cli/sqlstudio.py impact sys.objects examples/sample_procedure.sql > /tmp/impact.json
          python -m json.tool /tmp/impact.json > /dev/null
          python cli/sqlstudio.py impact sys.objects examples/sample_procedure.sql --html /tmp/impact.html
          test -s /tmp/impact.html
          python cli/sqlstudio.py circular-dependencies examples/circular_dependencies > /tmp/cycles.json
          python -m json.tool /tmp/cycles.json > /dev/null
          python -c "import json; p=json.load(open('/tmp/cycles.json')); assert p['summary']['cycle_count'] == 1; assert p['summary']['object_count'] == 2"
          python cli/sqlstudio.py dead-objects examples/dead_objects --entry-point dbo.Entry > /tmp/dead.json
          python -m json.tool /tmp/dead.json > /dev/null
          python -c "import json; p=json.load(open('/tmp/dead.json')); assert p['classification'] == 'candidate_only'; assert p['summary']['candidate_object_count'] == 1; assert p['dead_object_candidates'][0]['members'][0]['name'] == 'dbo.Orphan'; assert p['limitations']['safe_to_delete'] is False"
          python cli/sqlstudio.py analyze examples/dead_objects --entry-point dbo.Entry > /tmp/rules.json
          python -m json.tool /tmp/rules.json > /dev/null
          python -c "import json; p=json.load(open('/tmp/rules.json')); assert p['summary']['rule_count'] == 2; assert p['summary']['warning_count'] == 1; assert p['findings'][0]['rule_id'] == 'SQL002'; assert p['findings'][0]['objects'] == ['dbo.Orphan']"
          python cli/sqlstudio.py analyze examples/circular_dependencies --rule SQL001 > /tmp/rules-cycle.json
          python -c "import json; p=json.load(open('/tmp/rules-cycle.json')); assert p['summary']['error_count'] == 1; assert p['findings'][0]['rule_id'] == 'SQL001'"
          set +e
          python cli/sqlstudio.py analyze examples/dead_objects --entry-point dbo.Entry --fail-on warning > /tmp/rules-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 2
          python -m json.tool /tmp/rules-gate.json > /dev/null
