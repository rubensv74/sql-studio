name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q src cli

      - name: Validate package imports
        run: |
          python -c "import sqlstudio"
          python -c "from sqlstudio import __version__, SqlSource, RepositoryAnalysisEngine, RepositoryAnalysisSerializer"
          python -c "from sqlstudio.impact_analysis import ImpactAnalysisEngine, ImpactReportExporter"
          python -c "from sqlstudio.circular_dependencies import CircularDependencyEngine, CircularDependencySerializer"
          python -c "from sqlstudio.dead_objects import DeadObjectAnalyzer, DeadObjectSerializer"
          python -c "from sqlstudio.rules import StaticAnalysisAnalyzer, StaticAnalysisRuleEngine, StaticAnalysisSerializer"
          python -c "from sqlstudio import DeadObjectEngine, Severity, StaticAnalysisRuleEngine"
          python -c "from sqlstudio.cli import main, build_parser"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          output=$(python -m unittest discover -s tests -p "test_*.py" -v 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -n 40)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Unit test failure::$message"
            exit "$status"
          fi

      - name: Validate repository CLI wrapper
        shell: bash
        run: |
          python cli/sqlstudio.py --version
          python cli/sqlstudio.py --help
          python cli/sqlstudio.py parse examples/sample_procedure.sql > /tmp/parse.json
          python cli/sqlstudio.py parse tests/fixtures/tsql_complex/complex_view.sql > /tmp/complex-parse.json
          python -c "import json; p=json.load(open('/tmp/complex-parse.json')); o=p['objects'][0]; assert o['name'] == 'Order Summary' and o['schema'] == 'reporting'; refs={(r['database'], r['schema'], r['name']) for r in o['references'] if r['kind']=='reference'}; assert refs == {('OtherDb','sales','Order Header'),(None,'crm','Customer Master'),(None,'audit','Order Flags')}"
          python cli/sqlstudio.py parse tests/fixtures/object_scopes/multi_modules.sql > /tmp/object-scopes.json
          python -c "import json; p=json.load(open('/tmp/object-scopes.json')); assert [o['name'] for o in p['objects']] == ['ProcA','ProcB']; a,b=p['objects']; assert a['dynamic_sql'] is True and b['dynamic_sql'] is False; assert {r['name'] for r in a['references']} >= {'SourceA','sp_executesql'}; assert {r['name'] for r in b['references']} >= {'SourceB','HelperB'}"
          python cli/sqlstudio.py parse tests/fixtures/object_scopes/procedure_parameters.sql > /tmp/procedure-parameters.json
          python -c "import json; p=json.load(open('/tmp/procedure-parameters.json')); o=p['objects'][0]; assert len(o['parameters']) == 7; assert [v['name'] for v in o['variables']] == ['@LocalBatchId','@LocalStatus']; assert o['parameters'][-1]['name'] == '@IsReady' and o['parameters'][-1]['output'] is True; assert o['parameters'][5]['default_value'] == 'NULL'"
          python cli/sqlstudio.py parse tests/fixtures/real_repository/multi_scope_physical_script.sql > /tmp/multi-scope-physical-script.json
          python -c "import json; p=json.load(open('/tmp/multi-scope-physical-script.json')); scripts=[o for o in p['objects'] if o['object_type']=='Script']; assert len(scripts)==1; assert len(p['objects'])==2; assert {r['name'] for r in scripts[0]['references']} >= {'BeforeTarget','AfterTarget','sp_executesql'}; assert scripts[0]['dynamic_sql'] is True"
          python cli/sqlstudio.py parse tests/fixtures/real_repository/update_temp_alias.sql > /tmp/update-temp-alias.json
          python -c "import json; p=json.load(open('/tmp/update-temp-alias.json')); refs={r['name'] for r in p['objects'][0]['references'] if r['kind']=='reference'}; assert refs == {'SourceRows'} and 'eb' not in {name.casefold() for name in refs}"
          python cli/sqlstudio.py dependencies tests/fixtures/object_scopes/foreign_key_foundations.sql > /tmp/fk-dependencies.json
          python -c "import json; p=json.load(open('/tmp/fk-dependencies.json')); edges={(e['source'],e['target']) for e in p['edges']}; assert ('warroom.ExportBatchRow','warroom.ExportBatch') in edges; assert ('warroom.ImportBatch','warroom.ExportBatch') in edges; assert not any(e['target'].casefold() == 'on' for e in p['edges'])"
          python cli/sqlstudio.py dependencies tests/fixtures/source_identity/seed_a.sql tests/fixtures/source_identity/seed_b.sql > /tmp/source-identity.json
          python -c "import json; p=json.load(open('/tmp/source-identity.json')); scripts={n['name'] for n in p['nodes'] if n['object_type']=='Script'}; assert scripts == {'script:tests/fixtures/source_identity/seed_a.sql','script:tests/fixtures/source_identity/seed_b.sql'}; edges={(e['source'],e['target']) for e in p['edges']}; assert ('script:tests/fixtures/source_identity/seed_a.sql','dbo.SourceIdentityTargetA') in edges; assert ('script:tests/fixtures/source_identity/seed_b.sql','dbo.SourceIdentityTargetB') in edges"
          python cli/sqlstudio.py dependencies examples/sample_procedure.sql > /tmp/dependencies.json
          python cli/sqlstudio.py cross-references examples/sample_procedure.sql > /tmp/cross-references.json
          python cli/sqlstudio.py impact sys.objects examples/sample_procedure.sql > /tmp/impact.json
          python -m json.tool /tmp/impact.json > /dev/null
          python cli/sqlstudio.py impact sys.objects examples/sample_procedure.sql --html /tmp/impact.html
          test -s /tmp/impact.html
          python cli/sqlstudio.py circular-dependencies examples/circular_dependencies > /tmp/cycles.json
          python -m json.tool /tmp/cycles.json > /dev/null
          python -c "import json; p=json.load(open('/tmp/cycles.json')); assert p['summary']['cycle_count'] == 1; assert p['summary']['object_count'] == 2"
          python cli/sqlstudio.py dead-objects examples/dead_objects --entry-point dbo.Entry > /tmp/dead.json
          python -m json.tool /tmp/dead.json > /dev/null
          python -c "import json; p=json.load(open('/tmp/dead.json')); assert p['classification'] == 'candidate_only'; assert p['summary']['candidate_object_count'] == 1; assert p['dead_object_candidates'][0]['members'][0]['name'] == 'dbo.Orphan'; assert p['limitations']['safe_to_delete'] is False"
          python cli/sqlstudio.py analyze examples/dead_objects --entry-point dbo.Entry > /tmp/rules.json
          python -m json.tool /tmp/rules.json > /dev/null
          python -c "import json; p=json.load(open('/tmp/rules.json')); assert p['summary']['rule_count'] == 2; assert p['summary']['warning_count'] == 1; assert p['findings'][0]['rule_id'] == 'SQL002'; assert p['findings'][0]['objects'] == ['dbo.Orphan']"
          python cli/sqlstudio.py repository-analysis examples/dead_objects --entry-point dbo.Entry --output /tmp/repository-analysis.json --html /tmp/repository-analysis.html
          python -c "import json; p=json.load(open('/tmp/repository-analysis.json')); assert p['schema_version']=='1.0'; assert p['summary']['source_count'] >= 1; assert p['context']['dependency_direction']=='source -> target'; assert p['context']['dead_objects_are_candidates_only'] is True; assert any(f['rule_id']=='SQL002' for f in p['findings'])"
          test -s /tmp/repository-analysis.html
          grep -q "Análisis del repositorio" /tmp/repository-analysis.html
          python cli/sqlstudio.py analyze examples/circular_dependencies --rule SQL001 > /tmp/rules-cycle.json
          python -c "import json; p=json.load(open('/tmp/rules-cycle.json')); assert p['summary']['error_count'] == 1; assert p['findings'][0]['rule_id'] == 'SQL001'"
          set +e
          python cli/sqlstudio.py analyze examples/dead_objects --entry-point dbo.Entry --fail-on warning > /tmp/rules-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 2
          python -m json.tool /tmp/rules-gate.json > /dev/null

      - name: Build distributions
        shell: bash
        run: |
          version=$(python -c "import sqlstudio; print(sqlstudio.__version__)")
          python -m pip install --disable-pip-version-check --quiet build
          python -m build
          test -f "dist/sql_studio-${version}-py3-none-any.whl"
          test -f "dist/sql_studio-${version}.tar.gz"

      - name: Validate installed wheel and console entry point
        shell: bash
        run: |
          expected_version=$(python -c "import sqlstudio; print(sqlstudio.__version__)")
          wheel="dist/sql_studio-${expected_version}-py3-none-any.whl"
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps "$wheel"
          repo="$GITHUB_WORKSPACE"
          cd /tmp
          actual_version=$(PYTHONPATH= sqlstudio --version)
          test "$actual_version" = "sqlstudio ${expected_version}"
          EXPECTED_VERSION="$expected_version" PYTHONPATH= python -c "import importlib.metadata as m, os, sqlstudio; expected=os.environ['EXPECTED_VERSION']; assert sqlstudio.__version__ == expected; assert m.version('sql-studio') == expected; assert '/src/sqlstudio/' not in sqlstudio.__file__.replace('\\\\', '/')"
          PYTHONPATH= sqlstudio parse "$repo/tests/fixtures/tsql_complex/complex_view.sql" > /tmp/installed-complex-parse.json
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-complex-parse.json')); o=p['objects'][0]; assert o['name'] == 'Order Summary'; assert len([r for r in o['references'] if r['kind']=='reference']) == 3"
          PYTHONPATH= sqlstudio parse "$repo/tests/fixtures/object_scopes/multi_modules.sql" > /tmp/installed-object-scopes.json
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-object-scopes.json')); assert [o['name'] for o in p['objects']] == ['ProcA','ProcB']; assert p['objects'][0]['dynamic_sql'] is True; assert p['objects'][1]['dynamic_sql'] is False"
          PYTHONPATH= sqlstudio parse "$repo/tests/fixtures/object_scopes/procedure_parameters.sql" > /tmp/installed-procedure-parameters.json
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-procedure-parameters.json')); o=p['objects'][0]; assert len(o['parameters']) == 7; assert [v['name'] for v in o['variables']] == ['@LocalBatchId','@LocalStatus']; assert o['parameters'][-1]['output'] is True"
          PYTHONPATH= sqlstudio parse "$repo/tests/fixtures/real_repository/multi_scope_physical_script.sql" > /tmp/installed-multi-scope-physical-script.json
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-multi-scope-physical-script.json')); scripts=[o for o in p['objects'] if o['object_type']=='Script']; assert len(scripts)==1 and len(p['objects'])==2; assert scripts[0]['dynamic_sql'] is True"
          PYTHONPATH= sqlstudio parse "$repo/tests/fixtures/real_repository/update_temp_alias.sql" > /tmp/installed-update-temp-alias.json
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-update-temp-alias.json')); refs={r['name'] for r in p['objects'][0]['references'] if r['kind']=='reference'}; assert refs == {'SourceRows'} and 'eb' not in {name.casefold() for name in refs}"
          PYTHONPATH= sqlstudio dependencies "$repo/tests/fixtures/object_scopes/foreign_key_foundations.sql" > /tmp/installed-fk-dependencies.json
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-fk-dependencies.json')); edges={(e['source'],e['target']) for e in p['edges']}; assert ('warroom.ExportBatchRow','warroom.ExportBatch') in edges; assert ('warroom.ImportBatch','warroom.ExportBatch') in edges"
          PYTHONPATH= sqlstudio dependencies "$repo/tests/fixtures/source_identity/seed_a.sql" "$repo/tests/fixtures/source_identity/seed_b.sql" > /tmp/installed-source-identity.json
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-source-identity.json')); scripts={n['name'] for n in p['nodes'] if n['object_type']=='Script'}; assert len(scripts)==2 and all(n.startswith('script:') for n in scripts); targets={e['target'] for e in p['edges'] if e['source'] in scripts}; assert targets == {'dbo.SourceIdentityTargetA','dbo.SourceIdentityTargetB'}"
          PYTHONPATH= sqlstudio analyze "$repo/examples/dead_objects" --entry-point dbo.Entry > /tmp/installed-rules.json
          PYTHONPATH= python -m json.tool /tmp/installed-rules.json > /dev/null
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-rules.json')); assert p['summary']['rule_count'] == 2; assert p['findings'][0]['rule_id'] == 'SQL002'"
          PYTHONPATH= sqlstudio repository-analysis "$repo/examples/dead_objects" --entry-point dbo.Entry --output /tmp/installed-repository-analysis.json --html /tmp/installed-repository-analysis.html
          PYTHONPATH= python -c "import json; p=json.load(open('/tmp/installed-repository-analysis.json')); assert p['schema_version']=='1.0'; assert p['summary']['source_count'] >= 1; assert p['context']['dependency_direction']=='source -> target'; assert any(f['rule_id']=='SQL002' for f in p['findings'])"
          test -s /tmp/installed-repository-analysis.html
          grep -q "Trazabilidad de fuentes" /tmp/installed-repository-analysis.html

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: sql-studio-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
